# Lean LLM Guard config for a coding-agent CLI session.
# Drop in as llm_guard_api/config/scanners.yml. See ../SKILL.md.
app:
  name: LLM Guard API (agent session)
  log_level: INFO
  log_json: false
  scan_fail_fast: false
  scan_prompt_timeout: 30
  scan_output_timeout: 30
  lazy_load: false

rate_limit:
  enabled: false

# No `auth:` block == auth disabled. Port is bound to 127.0.0.1 only.

tracing:
  exporter: console

metrics:
  exporter: prometheus

input_scanners:
  - type: Secrets
    params:
      redact_mode: "all"
  - type: Regex
    params:
      patterns: ['Bearer\s+[A-Za-z0-9._~+/=-]{20,}', "AKIA[0-9A-Z]{16}", "gh[pousr]_[A-Za-z0-9]{36}", "sk-[A-Za-z0-9]{20,}"]
      is_blocked: true
      match_type: search
      redact: true
  - type: InvisibleText
    params: {}

output_scanners: []
